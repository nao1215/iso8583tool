name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it; runs on
# main and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (atago)
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    # POSIX runners use the bash bootstrap; the Windows runner uses the native
    # PowerShell twin (run.ps1) so the native binaries get native paths.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install atago
        uses: nao1215/setup-atago@5dca90fe652651408ccd1c2aee030767484482a9 # v0.1.5
        with:
          version: v0.26.3

      # Call the bootstrap directly (make is not present on the Windows runner).
      # Scenarios that need a POSIX shell are gated with skip: { os: windows }.
      - name: Run end-to-end tests (POSIX)
        if: runner.os != 'Windows'
        run: ./e2e/run.sh

      - name: Run end-to-end tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/run.ps1
