name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Re-run the full verification suite on the exact tagged commit. The unit,
  # e2e, and lint workflows only trigger on push to main and pull requests, so
  # without this gate a tag pushed to the wrong commit could publish an
  # unverified artifact. release depends on this job and never runs if it fails.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Run unit tests
        run: go test ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run --config .golangci.yml --timeout 10m

      - name: Install atago
        uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3
        with:
          version: v0.25.0

      - name: Build
        run: make build

      - name: Run end-to-end tests
        run: make e2e

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # base64 of checksums.txt: the subjects the SLSA provenance job attests.
      hashes: ${{ steps.hash.outputs.hashes }}
    # contents: create the GitHub Release and upload assets.
    # id-token: keyless cosign signing via GitHub OIDC.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub build provenance for `gh attestation verify`. It is not a
      # release asset, which is why the SLSA provenance job below also runs.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Generate subject
        id: hash
        env:
          ARTIFACTS: "${{ steps.run-goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail

          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(base64 -w0 < "$checksum_file")" >> "$GITHUB_OUTPUT"

  # SLSA build provenance as a release asset (multiple.intoto.jsonl), so anyone
  # holding only the downloaded files can check where they were built. The
  # generator must be referenced by tag, not by commit SHA: slsa-verifier checks
  # the reusable workflow's ref.
  provenance:
    name: SLSA provenance
    needs: [release]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true # upload to the release goreleaser just created

  # Verify the published archives against the published provenance, the way a
  # user would, so a provenance that does not verify fails the release run.
  verification:
    name: Verify SLSA provenance
    needs: [release, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install the verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "*.tar.gz" -p "*.zip"
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "$PROVENANCE"

      # checksums.txt also lists the SBOMs; only the archives are downloaded
      # above, so only they are verified here.
      - name: Verify assets
        env:
          CHECKSUMS: ${{ needs.release.outputs.hashes }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          checksums=$(echo "$CHECKSUMS" | base64 -d)
          while read -r _ fn; do
            case "$fn" in
              *.tar.gz|*.zip) ;;
              *) continue ;;
            esac
            echo "Verifying $fn"
            slsa-verifier verify-artifact --provenance-path "$PROVENANCE" \
                                          --source-uri "github.com/$GITHUB_REPOSITORY" \
                                          --source-tag "$GITHUB_REF_NAME" \
                                          "$fn"
          done <<<"$checksums"
