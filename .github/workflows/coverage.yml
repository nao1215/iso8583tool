name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions/pull-requests scopes are for octocov's artifact datastore
    # (report/diff in .octocov.yml) and PR comment.
    permissions:
      contents: read
      actions: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          check-latest: true

      # The combined coverage runs the atago E2E suite against a `go build -cover`
      # binary, so atago must be on PATH (same pinned action the E2E workflow uses).
      - name: Install atago
        uses: nao1215/setup-atago@5dca90fe652651408ccd1c2aee030767484482a9 # v0.1.5
        with:
          version: v0.26.3

      # Combines unit-test coverage with self-hosted E2E coverage (E2E runs a
      # `go build -cover` iso8583tool and collects covdata via GOCOVERDIR), then
      # merges both into coverage.out.
      - name: Run combined unit + E2E coverage
        run: make coverage

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .octocov.yml
          work-dir: .
          args: --report=coverage.out

