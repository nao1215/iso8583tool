# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# iso8583tool measured end to end with himorime
# (https://github.com/nao1215/himorime): the process a user starts, from its
# first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Message documents are generated by gen.sh before measuring. Both revisions
# run the working tree's gen.sh (${head_root}), so they read the same bytes;
# setup packs them with the iso8583tool of the revision measured.
#
# iso8583tool reads one message per call, so the size in a benchmark name is
# the number of data fields in that message: 10, where start-up dominates,
# and 124, every data field of the basei-starter spec at its largest length
# (about 35 KB packed), which is the largest message there is. A message has
# no larger size, so no benchmark declares a throughput.
version: "1"

suite:
  name: iso8583tool
  description: Start-up, and view, diff, redact, convert, validate, doctor and send --dry-run on messages of 10 and 124 fields.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..
  # The Makefile builds with cgo disabled, as the released binaries are.
  env:
    CGO_ENABLED: "0"

defaults:
  warmup: 2
  runs: 20
  # iso8583tool reads no configuration unless --config is given, but keep
  # HOME inside the benchmark's own directory so nothing of the developer's
  # environment can leak in.
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu:
      max_percent: 15
      min_difference: 2ms
    memory:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting iso8583tool and exiting.
    tags: [smoke]
    commands:
      iso8583tool:
        command: ["${artifact}", version]

  - name: view 10 fields
    description: A message of 10 fields unpacked and printed as the describe view, as JSON, and filtered to one field.
    tags: [smoke]
    setup: &message-10
      - command: [sh, "${head_root}/gen.sh", document, "10", "${workdir}/message.json"]
      - command: [sh, -c, '"$1" convert --output "$2/message.hex" "$2/message.json"', sh, "${artifact}", "${workdir}"]
    baseline: describe
    commands:
      describe:
        command: ["${artifact}", view, "${workdir}/message.hex"]
      json:
        command: ["${artifact}", view, --format, json, "${workdir}/message.hex"]
      filter:
        command: ["${artifact}", view, --filter, "11", "${workdir}/message.hex"]

  - name: view 124 fields
    description: >-
      A message of every data field at its largest length unpacked and
      printed as the describe view, as JSON, and filtered to one EMV tag;
      every field is decoded and masked.
    tags: [large]
    setup: &message-124
      - command: [sh, "${head_root}/gen.sh", document, "124", "${workdir}/message.json"]
      - command: [sh, -c, '"$1" convert --output "$2/message.hex" "$2/message.json"', sh, "${artifact}", "${workdir}"]
    baseline: describe
    commands:
      describe:
        command: ["${artifact}", view, "${workdir}/message.hex"]
      json:
        command: ["${artifact}", view, --format, json, "${workdir}/message.hex"]
      filter:
        command: ["${artifact}", view, --filter, "55.9F02", "${workdir}/message.hex"]

  - name: diff 10 fields
    description: Two messages of 10 fields whose every value differs, compared field by field.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", document, "10", "${workdir}/a.json"]
      - command: [sh, "${head_root}/gen.sh", changed, "10", "${workdir}/b.json"]
      - command: [sh, -c, '"$1" convert --output "$2/a.hex" "$2/a.json" && "$1" convert --output "$2/b.hex" "$2/b.json"', sh, "${artifact}", "${workdir}"]
    baseline: describe
    commands:
      describe:
        command: ["${artifact}", diff, "${workdir}/a.hex", "${workdir}/b.hex"]
      json:
        command: ["${artifact}", diff, --format, json, "${workdir}/a.hex", "${workdir}/b.hex"]

  - name: diff 124 fields
    description: Two messages of every data field whose every value differs, compared field by field and tag by tag.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", document, "124", "${workdir}/a.json"]
      - command: [sh, "${head_root}/gen.sh", changed, "124", "${workdir}/b.json"]
      - command: [sh, -c, '"$1" convert --output "$2/a.hex" "$2/a.json" && "$1" convert --output "$2/b.hex" "$2/b.json"', sh, "${artifact}", "${workdir}"]
    baseline: describe
    commands:
      describe:
        command: ["${artifact}", diff, "${workdir}/a.hex", "${workdir}/b.hex"]
      json:
        command: ["${artifact}", diff, --format, json, "${workdir}/a.hex", "${workdir}/b.hex"]

  - name: redact 10 fields
    description: A message of 10 fields written as a masked JSON document and as text.
    tags: [smoke]
    setup: *message-10
    baseline: json
    commands:
      json:
        command: ["${artifact}", redact, "${workdir}/message.hex"]
      text:
        command: ["${artifact}", redact, --format, text, "${workdir}/message.hex"]

  - name: redact 124 fields
    description: A message of every data field written as a masked JSON document and as text.
    tags: [large]
    setup: *message-124
    baseline: json
    commands:
      json:
        command: ["${artifact}", redact, "${workdir}/message.hex"]
      text:
        command: ["${artifact}", redact, --format, text, "${workdir}/message.hex"]

  - name: convert 10 fields
    description: A document of 10 fields packed into a message, and the message unpacked into a document.
    tags: [smoke]
    setup: *message-10
    baseline: pack
    commands:
      pack:
        command: ["${artifact}", convert, "${workdir}/message.json"]
      unpack:
        command: ["${artifact}", convert, "${workdir}/message.hex"]

  - name: convert 124 fields
    description: A document of every data field packed into a message, and the message unpacked into a document.
    tags: [large]
    setup: *message-124
    baseline: pack
    commands:
      pack:
        command: ["${artifact}", convert, "${workdir}/message.json"]
      unpack:
        command: ["${artifact}", convert, "${workdir}/message.hex"]

  - name: validate 10 fields
    description: A message of 10 fields checked to unpack, and checked with --strict against the fields a 0200 must and should carry.
    tags: [smoke]
    setup: *message-10
    baseline: default
    commands:
      default:
        command: ["${artifact}", validate, "${workdir}/message.hex"]
      strict:
        command: ["${artifact}", validate, --strict, "${workdir}/message.hex"]

  - name: validate 124 fields
    description: A message of every data field checked to unpack, and checked with --strict.
    tags: [large]
    setup: *message-124
    baseline: default
    commands:
      default:
        command: ["${artifact}", validate, "${workdir}/message.hex"]
      strict:
        command: ["${artifact}", validate, --strict, "${workdir}/message.hex"]

  - name: validate error
    description: A message cut off after its bitmap, which fails to unpack with a hint to run doctor and exit 1.
    tags: [smoke]
    exit_codes: [1]
    commands:
      iso8583tool:
        command: ["${artifact}", validate, --raw, "01007220"]

  - name: doctor 10 fields
    description: A message of 10 fields unpacked with every built-in preset to recommend one.
    tags: [smoke]
    setup: *message-10
    commands:
      iso8583tool:
        command: ["${artifact}", doctor, "${workdir}/message.hex"]

  - name: doctor 124 fields
    description: A message of every data field unpacked with every built-in preset to recommend one.
    tags: [large]
    setup: *message-124
    commands:
      iso8583tool:
        command: ["${artifact}", doctor, "${workdir}/message.hex"]

  # send is measured with --dry-run: the message is packed, framed and
  # described, but no connection is opened. A live round trip needs a server
  # that outlives each run, and a himorime hook cannot leave one running
  # (see bench/README.md).
  - name: send 10 fields
    description: A document of 10 fields packed and framed with the default 2-byte header, without sending it (--dry-run).
    tags: [smoke]
    setup: *message-10
    commands:
      iso8583tool:
        command: ["${artifact}", send, "127.0.0.1:8583", --dry-run, "${workdir}/message.json"]

  - name: send 124 fields
    description: A document of every data field packed and framed, without sending it (--dry-run).
    tags: [large]
    setup: *message-124
    commands:
      iso8583tool:
        command: ["${artifact}", send, "127.0.0.1:8583", --dry-run, "${workdir}/message.json"]
