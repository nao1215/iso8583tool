# generated by octocov init
coverage:
  if: true
  acceptable: 90%
  # No exclude: main.go is exercised by the atago E2E suite (a `go build -cover`
  # binary feeds coverage.out), so the whole tree counts toward the number.
  # The README badge comes from nao1215/octocovs-central-repo, which collects
  # the report artifact this workflow uploads on main.
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
