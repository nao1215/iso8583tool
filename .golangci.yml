version: "2"
run:
  go: "1.26"
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      # errcheck's built-in list also skips fmt.Print/Printf/Println, which
      # write to stdout and fail on a closed pipe or a full disk. Only calls
      # whose documentation guarantees a nil error are excluded.
      disable-default-exclusions: true
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).Write
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - (*strings.Builder).WriteString
        - (hash.Hash).Write
        - (*io.PipeReader).CloseWithError
        - (*io.PipeWriter).CloseWithError
        - fmt.Fprint(*bytes.Buffer)
        - fmt.Fprintf(*bytes.Buffer)
        - fmt.Fprintln(*bytes.Buffer)
        - fmt.Fprint(*strings.Builder)
        - fmt.Fprintf(*strings.Builder)
        - fmt.Fprintln(*strings.Builder)
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        # G703 (path traversal via taint analysis) flags writes to the user-supplied
        # --output path, which is the intended behavior of this CLI. The rule is also
        # unstable across Go toolchain versions, so exclude it project-wide.
        - G703
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
        path: .*_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
