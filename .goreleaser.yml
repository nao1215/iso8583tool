version: 2
project_name: iso8583tool

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy
    - sh -c 'GOROOT="$(go env GOROOT)" CGO_ENABLED=0 GOOS=linux go-licenses save . --save_path=third_party_licenses/linux --force'
    - sh -c 'GOROOT="$(go env GOROOT)" CGO_ENABLED=0 GOOS=windows go-licenses save . --save_path=third_party_licenses/windows --force'
    - sh -c 'GOROOT="$(go env GOROOT)" CGO_ENABLED=0 GOOS=darwin go-licenses save . --save_path=third_party_licenses/darwin --force'

builds:
  - main: .
    binary: iso8583tool
    ldflags:
      - -s -w -X github.com/nao1215/iso8583tool/cmd.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listing files replaces goreleaser's defaults, so the project's own
    # LICENSE, README and CHANGELOG are named here too.
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - src: "third_party_licenses/{{ .Os }}/**/*"
        dst: THIRD_PARTY_LICENSES

checksum:
  name_template: "checksums.txt"

# Software Bill of Materials (SPDX, generated by syft) for every release
# archive. The SBOMs are listed in checksums.txt, so the cosign signature
# below covers them too.
sboms:
  - artifacts: archive

# Keyless artifact signing with cosign. Signing the checksums file transitively
# covers every published archive.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
